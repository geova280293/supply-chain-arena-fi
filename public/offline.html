<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline · Supply Chain Arena</title><link rel="stylesheet" href="css/app.css"></head><body>
<header class="topbar"><div class="brand"><div class="brand-mark"></div><div><div class="brand-title">Modo offline de emergencia</div><div class="brand-sub">Registro manual local</div></div></div><span class="status offline">sin servidor</span></header>
<main class="student-wrap main"><section class="card"><div class="card-title"><div><div class="eyebrow">Respaldo</div><h2>Registrar evento manualmente</h2></div><span id="pendingCount" class="status">0 eventos</span></div><div class="stack"><div><label>Equipo</label><input id="team" placeholder="Equipo A"></div><div><label>Integrante</label><input id="member" placeholder="Nombre"></div><div><label>Pedido / misión</label><input id="orderId" placeholder="PED-01"></div><div><label>Tipo de evento</label><select id="eventType"><option value="transport_start">Inicio de transporte</option><option value="intercepted">Interceptado</option><option value="delivered">Entregado</option><option value="produced">Producto terminado</option></select></div><div><label>Cantidad</label><input id="qty" type="number" min="1" value="1"></div><button class="btn yellow big" id="saveEvent">GUARDAR EVENTO</button><button class="btn light big" id="exportBtn">EXPORTAR JSON</button></div></section></main><div id="toast" class="toast"></div><script src="js/common.js"></script><script src="js/db.js"></script><script src="js/offline.js"></script></body></html>
